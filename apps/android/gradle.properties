org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
# Maven Central이 CI 러너 IP에 429를 돌려줘도 저장소를 바로 끄지 않도록 재시도를 늘린다(#437).
# 기본은 3번 시도에 약 3초라서 곧바로 저장소가 꺼지고, 플러그인을 "찾지 못했다"고만 나온다.
# 7번 시도하며 대기가 1·2·4·8·16·32초로 늘어난다(요청 하나당 최대 약 63초).
systemProp.org.gradle.internal.repository.max.tentatives=7
systemProp.org.gradle.internal.repository.initial.backoff=1000
